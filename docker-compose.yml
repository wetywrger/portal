version: "3.9"

services:
  backend:
    build: ./backend
    restart: unless-stopped
    working_dir: /app
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - db_data:/app/data
    environment:
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - ADMIN_SECRET_KEY=your-very-secure-secret-key-2024
      - PYTHONUNBUFFERED=1
    networks:
      - app_net

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app_net

volumes:
  db_data:

networks:
  app_net:
    driver: bridge
